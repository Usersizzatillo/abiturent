name: Deploy Abiturend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

# NOTE: cancel-in-progress only stops the runner job, NOT remote SSH commands
# already running on the VPS. The deploy script below uses flock: if a build is
# still running it fails fast so two builds never run concurrently.

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 45m
          timeout: 90s
          script: |
            set -e
            cd /opt/abiturend
            # Serialize deploys: flock fails fast if another build still runs
            # (a cancelled GitHub run may leave the remote process alive, so do
            # not wait for it — report and let the next run pick it up).
            exec 9>/tmp/abiturend-deploy.lock
            flock -n 9 || { echo "Another deploy is still running on this server"; exit 1; }
            # Fix broken DNS (observed after reboots): ensure outbound resolution
            # works for github.com and package registries before building.
            if ! timeout 5 getent hosts github.com >/dev/null 2>&1; then
              rm -f /etc/resolv.conf
              printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' > /etc/resolv.conf
              systemctl restart systemd-resolved 2>/dev/null || true
              timeout 10 getent hosts github.com >/dev/null 2>&1 || true
            fi
            # Ensure swap exists so builds cannot freeze the small VPS (OOM)
            if ! swapon --show | grep -q .; then
              if [ ! -f /swapfile ]; then
                fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
                chmod 600 /swapfile
                mkswap /swapfile
              fi
              swapon /swapfile || true
              echo '/swapfile none swap sw 0 0' >> /etc/fstab || true
            fi
            git fetch origin main
            git reset --hard origin/main
            cp -n .env.example .env || true
            # IMPORTANT: do NOT prune the builder cache. Keeping it makes every
            # deploy incremental, so rebuilds are light and never OOM the VPS.
            export DOCKER_BUILDKIT=1
            docker compose build
            docker compose up -d --remove-orphans
            docker compose exec -T backend python manage.py migrate --noinput || true
            docker compose exec -T backend python manage.py collectstatic --noinput || true
            docker compose exec -T backend python manage.py tg_set_webhook --url "https://${{ secrets.DEPLOY_HOST }}/webhooks/telegram/" || true
            echo "Deploy OK: $(date -u)"