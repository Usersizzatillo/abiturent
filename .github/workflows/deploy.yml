name: Deploy Abiturend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

# NOTE: cancel-in-progress only stops the runner job, NOT remote SSH commands
# already running on the VPS. The deploy script below uses flock so two builds
# never run concurrently (they wait), preventing OOM freezes.

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 45m
          timeout: 90s
          script: |
            set -e
            cd /opt/abiturend
            # Serialize deploys on the VPS: flock waits if another build runs
            exec 9>/tmp/abiturend-deploy.lock
            flock -w 2400 9 || { echo "Another deploy holds the lock"; exit 1; }
            # Ensure swap exists so builds cannot freeze the small VPS (OOM)
            if ! swapon --show | grep -q .; then
              if [ ! -f /swapfile ]; then
                fallocate -l 1G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=1024
                chmod 600 /swapfile
                mkswap /swapfile
              fi
              swapon /swapfile || true
              echo '/swapfile none swap sw 0 0' >> /etc/fstab || true
            fi
            git fetch origin main
            git reset --hard origin/main
            cp -n .env.example .env || true
            docker builder prune -f >/dev/null 2>&1 || true
            docker compose up -d --build --remove-orphans
            docker compose exec -T backend python manage.py migrate --noinput || true
            docker compose exec -T backend python manage.py collectstatic --noinput || true
            docker compose exec -T backend python manage.py tg_set_webhook --url "https://${{ secrets.DEPLOY_HOST }}/webhooks/telegram/" || true
            echo "Deploy OK: $(date -u)"