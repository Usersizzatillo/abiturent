worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_names_hash_bucket_size 64;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Docker embedded DNS: resolve upstream names at request time so
    # container IP churn (rebuilds) never breaks the proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- :80 - named domain -> HTTPS redirect (acme stays on :80) ----
    server {
        listen 80;
        server_name abituriyent.orgtrace.uz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot/;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- :80 - default (direct IP access stays on plain HTTP) ----
    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 20m;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot/;
        }

        location / {
            set $upstream http://frontend:3000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            set $upstream http://backend:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            set $upstream http://backend:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /webhooks/ {
            set $upstream http://backend:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            alias /srv/static/;
        }

        location /media/ {
            alias /srv/media/;
        }
    }

    # ---- :443 - HTTPS ----
    server {
        listen 443 ssl;
        http2 on;
        server_name abituriyent.orgtrace.uz _;

        ssl_certificate /etc/letsencrypt/live/abituriyent.orgtrace.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/abituriyent.orgtrace.uz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        client_max_body_size 20m;

        location / {
            set $upstream http://frontend:3000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            set $upstream http://backend:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            set $upstream http://backend:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /webhooks/ {
            set $upstream http://backend:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            alias /srv/static/;
        }

        location /media/ {
            alias /srv/media/;
        }
    }
}